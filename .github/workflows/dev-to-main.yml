name: Enforce dev to main

on:
  pull_request:
    branches: [ main ]

jobs:
  check-source-branch:
    name: verify source is dev
    runs-on: ubuntu-latest
    steps:
      - name: Check PR head branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "❌ Pull requests into main must come from 'dev', not '${{ github.head_ref }}'."
            exit 1
          fi
          echo "✅ Source branch is dev."